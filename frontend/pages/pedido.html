<!DOCTYPE html> 
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seguimiento de Pedido</title>
  <link rel="stylesheet" href="../css/pedido.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- === BARRA SUPERIOR PERSONALIZADA === -->
  <header class="top-header">
    <nav class="top-navbar">
      <!-- Izquierda: botón hamburguesa / Catálogo -->
      <div class="left-controls">
        <button class="hamburger-btn" onclick="window.location.href='../pages/maison.html'">
          <i class="fa-solid fa-angles-left"></i>Catálogo
        </button>
      </div>

      <!-- Derecha: búsqueda, carrito y logout -->
      <div class="right-controls">
        <input type="text" placeholder="Buscar..." class="search-bar">

        <a href="../pages/carrito.html
        " class="nav-icon">
          <i class="fa-solid fa-cart-shopping"></i>
          <span id="cartCountHeader" class="cart-count">0</span>
        </a>

        <a href="../pageslogin.html" class="logout-btn">
          <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
        </a>
      </div>
    </nav>
  </header>

  <!-- === CONTENIDO PRINCIPAL === -->
  <div class="seguimiento-container">
    <h1>📦 Seguimiento de tu Pedido</h1>

    <div class="pedido-info">
      <p><strong>Número de pedido:</strong> #123456</p>
      <p><strong>Productos:</strong> Pizza finas hierbas, Granola con Yogur</p>
      <p><strong>Hora de pedido:</strong> 7:45 p.m.</p>
    </div>

  <script src="../js/pedidos/pedido.js"></script>
</body>
</html>
