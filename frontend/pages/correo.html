<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Correo</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/correo.css">
</head>
<body>

  <!-- Header -->
  <header class="cart-header">
    <a href="../pages/cuenta.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Cambiar Correo</h2>
    <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <!-- Contenido -->
  <main class="cart-container">
    <div class="form-card">
      <label for="correo-actual">Correo actual:</label>
      <input type="email" id="correo-actual" placeholder="Ingresa tu correo actual">

      <label for="correo-nuevo">Nuevo correo:</label>
      <input type="email" id="correo-nuevo" placeholder="Ingresa tu nuevo correo">

      <button class="btn" onclick="confirmarCambioCorreo()">Confirmar cambio</button>
    </div>
  </main>

  <script src="../js/correo/correo.js"></script>
</body>
</html>
