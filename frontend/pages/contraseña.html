<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambio de Contraseña</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/contraseña.css">
</head>
<body>

  <!-- Header -->
  <header class="cart-header">
    <a href="../pages/catalogo.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h2>Cambio de Contraseña</h2>
    <button class="logout-btn" onclick="cerrarSesion()">Cerrar Sesión</button>
  </header>

  <!-- Contenido -->
  <main class="cart-container">

    <!-- Formulario principal -->
    <div id="form-principal" class="form-card">
      <label for="anterior">Contraseña anterior:</label>
      <input type="password" id="anterior" placeholder="Ingresa tu contraseña actual">

      <p class="link" onclick="mostrarOlvide()">¿Olvidaste tu contraseña?</p>

      <label for="nueva">Nueva contraseña:</label>
      <input type="password" id="nueva" placeholder="Nueva contraseña">

      <label for="confirmar">Confirmar contraseña:</label>
      <input type="password" id="confirmar" placeholder="Confirma tu contraseña">

      <button class="btn" onclick="confirmarCambio()">Confirmar</button>
    </div>

    <!-- Olvidé mi contraseña -->
    <div id="form-olvide" class="form-card" style="display:none;">
      <h3>Restaurar contraseña</h3>
      <label for="nombre">Nombre:</label>
      <input type="text" id="nombre" placeholder="Tu nombre">

      <label for="apellidos">Apellidos:</label>
      <input type="text" id="apellidos" placeholder="Tus apellidos">

      <label for="correo">Correo:</label>
      <input type="email" id="correo" placeholder="Tu correo">

      <button class="btn" onclick="restaurar()">Restaurar Contraseña</button>
    </div>

    <!-- Nueva contraseña tras restaurar -->
    <div id="form-restaurar" class="form-card" style="display:none;">
      <h3>Ingresa tu nueva contraseña</h3>
      <label for="nueva2">Nueva contraseña:</label>
      <input type="password" id="nueva2" placeholder="Nueva contraseña">

      <label for="confirmar2">Confirmar contraseña:</label>
      <input type="password" id="confirmar2" placeholder="Confirma tu contraseña">

      <button class="btn" onclick="confirmarRestauracion()">Confirmar</button>
    </div>

  </main>

  <script src="../js/contraseña/contraseña.js"></script>
</body>
</html>
