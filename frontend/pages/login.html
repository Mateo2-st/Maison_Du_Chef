<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Avanzado</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="barraSuperior">
        <div class="iconoMenu"> 
            <i class="fa-solid fa-bars"></i>
            </div>
            <div class="logo">
                <img src="../imagenes/imagen logo/logo.png" alt="">
            </div>
            <div class="cuenta">
            <a href="../pages/registro.html"><i class="fa-solid fa-user"></i>Registrarse</a>
        </div>
    </header>

    <!--Menu hamburguesa--> 
    <nav class="menuLateral" id="menu-lateral">
        <div class="logoMenu">
            <img src="../imagenes/imagen logo/logo.png" alt="Maison Du Chef">
        </div>
        <button id="cerrar-menu">&#10006;</button>
        <ul>

            <li><a href="#">Asistencia al usuario</a></li>
            <li><a href="#unete">¿Quienes somos?</a></li>
        </ul>
    </nav>

    
    <div class="registro">
        <div class="imagenFondo">
            <div class="carruselItems">
            <img src="../imagenes/imagen fondo login/fondo.jpg">
            <img src="../imagenes/imagen fondo login/carrusel2.jpg" alt="">
            <img src="../imagenes/imagen fondo login/carrusel3.jpg" alt="">
            <img src="../imagenes/imagen fondo login/fondo.jpg" alt="">
            <img src="../imagenes/imagen fondo login/carrusel2.jpg" alt="">
            <img src="../imagenes/imagen fondo login/carrusel3.jpg" alt="">
            </div>
        </div>
        <div class="visual">
            <form action="../pages/catalogo.html" class="form">
            <h1 class="title">Iniciar Sesión</h1>
                <div class="inputContainer">
                    <input type="email" class="input" placeholder="">
                    <label class="label">E-mail</label> 
                </div>
                <div class="inputContainer">
                    <input type="password" class="input" placeholder="">
                    <label class="label">Contraseña</label> 
                </div>
                <input type="submit" class="submitBtn" value="Iniciar Sesión">
            </form>
        </div>
    </div>
    <script src="../js/menu lateral Login/menulateral.js"></script>
    <script src="../js/carrusel/carrusel.js"></script>
</body>
</html>
